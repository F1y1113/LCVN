# Important: Be careful when modifying this file! 
defaults:
  - base_pytorch_exp

tasks: [training]

ema:
  enable: True
  decay: 0.9999
    
training:
  lr: 8e-4
  precision: 16-mixed  
  batch_size: 160
  max_steps: -1
  max_epochs: 100
  detect_anomaly: false
  data:
    num_workers: 16
    shuffle: False
  checkpointing:
    every_n_train_steps: null  
    every_n_epochs: 5
    save_last: true  
    save_top_k: 1
    monitor: "training/loss"
    mode: "min" 
    enable_version_counter: true
    filename: "epoch={epoch:02d}-loss={training/loss:.4f}"
  optim:
    gradient_clip_val: 2.0  


  # early_stopping:
  #   monitor: "train/loss"
  #   patience: 1000  
  #   mode: "min"
  #   check_finite: true  

validation:
  precision: 16-mixed 
  batch_size: 128
  val_every_n_step: 1.0
  val_every_n_epoch: 1000  
  num_sanity_val_steps: 0  
  limit_batch: 1.0
  data:
    num_workers: 1

test:
  precision: bf16-mixed  
  batch_size: 128
  limit_batch: 1.0
  data:
    num_workers: 1
    
reload_dataloaders_every_n_epochs: 1

